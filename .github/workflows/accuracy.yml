name: Lineage accuracy

# Measures SQL-parse lineage against `dbt parse` on the public projects in
# scripts/accuracy/projects.json and fails when dbt-lineage misses a
# dependency dbt knows about. Then measures column lineage against sqlglot
# (scripts/accuracy-columns) and fails when it drops below baseline.json.
# Weekly runs catch upstream dbt releases and also run the scale benchmark
# (scripts/bench-scale) on generated 2k- and 10k-model projects and the BI
# exposure importer check (scripts/accuracy-bi, Metabase via Docker).

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/accuracy/**"
      - "scripts/accuracy-columns/**"
      - "scripts/accuracy-impact/**"
      - "scripts/accuracy-plan/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/accuracy.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/accuracy/**"
      - "scripts/accuracy-columns/**"
      - "scripts/accuracy-impact/**"
      - "scripts/accuracy-plan/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/accuracy.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  accuracy:
    name: Lineage accuracy vs dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/accuracy/projects.json
      - name: Cache project checkouts
        uses: actions/cache@v4
        with:
          path: |
            .accuracy/models/*/
            !.accuracy/models/*/**/target
            !.accuracy/models/*/**/.dbt-lineage
          key: accuracy-projects-${{ hashFiles('scripts/accuracy/projects.json') }}
      - run: cargo build --release --no-default-features
      - run: python3 scripts/accuracy/run.py
      - name: Column lineage vs sqlglot
        run: python3 scripts/accuracy-columns/run.py
      # Weekly only: generated 2k- and 10k-model projects from the checkouts
      # above. Absolute times depend on the runner, so the gate is on scaling:
      # time must grow at most 2x faster than the project.
      - name: Scale benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/bench-scale/run.py --sizes 2000,10000 --max-scaling 2
      # Slow (a dbt compile per column removal, two dbt parse per commit):
      # weekly and on demand only.
      - name: Column impact vs sqlglot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/accuracy-impact/run.py
      - name: Rebuild selector vs dbt state:modified+
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/accuracy-plan/run.py
      # Weekly and on demand only: BI exposure importers (Superset, Tableau,
      # Looker, Power BI, anofox) against ~100 MB of public artifacts pinned in
      # scripts/accuracy-bi/sources.json, then Metabase against a throwaway
      # metabase/metabase container (Docker is on ubuntu-latest). Each step
      # fails below scripts/accuracy-bi/thresholds.json and appends its table
      # to the job summary.
      - name: Cache BI artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .accuracy/bi
          key: accuracy-bi-${{ hashFiles('scripts/accuracy-bi/sources.json') }}
      - name: BI importers vs public dashboards
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: |
          python3 scripts/accuracy-bi/fetch.py
          uv run --no-project --with sqlglot --with pyyaml --with lkml python scripts/accuracy-bi/run.py
      - name: BI importers vs Metabase (Docker)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: uv run --no-project --with sqlglot --with pyyaml --with lkml python scripts/accuracy-bi/metabase.py --docker
