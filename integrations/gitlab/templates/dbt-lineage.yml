spec:
  inputs:
    stage:
      default: test
      description: Pipeline stage for the job.
    version:
      default: v0
      description: Tag of the ghcr.io/sipemu/dbt-lineage image (v0, 0.10, 0.10.0, latest).
    project-dir:
      default: .
      description: Path to the dbt project (containing dbt_project.yml).
    base:
      default: auto
      description: Base ref to diff against. `auto` uses the MR target branch.
    manifest:
      default: ""
      description: Optional path to a compiled manifest.json.
    fail-on:
      default: lint-errors
      description: Comma-separated lint-errors, plan-empty, manifest-stale, or never.
    comment:
      type: boolean
      default: true
      description: Post a sticky MR note. Needs GITLAB_TOKEN (project access token, api scope).
---
dbt-lineage:
  stage: $[[ inputs.stage ]]
  image:
    name: ghcr.io/sipemu/dbt-lineage:$[[ inputs.version ]]
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
    DBT_LINEAGE_PROJECT_DIR: "$[[ inputs.project-dir ]]"
    DBT_LINEAGE_BASE: "$[[ inputs.base ]]"
    DBT_LINEAGE_MANIFEST: "$[[ inputs.manifest ]]"
    DBT_LINEAGE_FAIL_ON: "$[[ inputs.fail-on ]]"
    DBT_LINEAGE_COMMENT: "$[[ inputs.comment ]]"
  script:
    - |
      set -- -p "$DBT_LINEAGE_PROJECT_DIR"
      [ -n "$DBT_LINEAGE_MANIFEST" ] && set -- "$@" --manifest "$DBT_LINEAGE_MANIFEST"
      rc=0
      dbt-lineage ci report "$@" --base "$DBT_LINEAGE_BASE" --fail-on "$DBT_LINEAGE_FAIL_ON" \
        --out dbt-lineage-report.md --outputs dbt-lineage.env || rc=$?
      dbt-lineage lint "$@" -o codeclimate > gl-code-quality-report.json || true
      if [ "$DBT_LINEAGE_COMMENT" = "true" ] && [ -f dbt-lineage-report.md ]; then
        dbt-lineage ci comment --file dbt-lineage-report.md \
          || echo "dbt-lineage: MR note skipped (set GITLAB_TOKEN to a project access token with api scope)"
      fi
      exit $rc
  artifacts:
    when: always
    expose_as: dbt-lineage report
    paths:
      - dbt-lineage-report.md
    reports:
      codequality: gl-code-quality-report.json
      dotenv: dbt-lineage.env
