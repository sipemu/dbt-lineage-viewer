[package]
name = "dbt-lineage"
version = "0.18.0"
edition = "2021"
description = "PR-time dbt lineage, impact analysis and rebuild plans without a warehouse: CLI, TUI, CI report and MCP server"
license = "MIT"
repository = "https://github.com/sipemu/dbt-lineage-viewer"
homepage = "https://github.com/sipemu/dbt-lineage-viewer"
readme = "README.md"
keywords = ["dbt", "lineage", "dag", "sql", "tui"]
categories = ["command-line-utilities", "visualization"]

# `cargo binstall dbt-lineage` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "dbt-lineage"
path = "src/main.rs"

[features]
default = ["tui", "lsp"]
tui = ["ratatui", "crossterm", "nucleo-matcher", "syntect"]
# `dbt-lineage lsp`: stdio language server for editors.
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:url"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
colored = "2"
anyhow = "1"
thiserror = "2"
indexmap = "2"
rayon = "1"
blake3 = "1"
bincode = "1"
sqlparser = { version = "0.52", features = ["visitor"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
ureq = { version = "2", features = ["json"] }

# TUI dependencies (feature-gated)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
nucleo-matcher = { version = "0.3", optional = true }
syntect = { version = "5", optional = true, default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
yaml-rust2 = "0.10"

# LSP dependencies (feature-gated)
lsp-server = { version = "0.7", optional = true }
lsp-types = { version = "0.95", optional = true }
url = { version = "2", optional = true }
quick-xml = "0.37"
# Renders model Jinja for column lineage without dbt (src/parser/render.rs).
minijinja = { version = "3", default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "loop_controls", "fuel", "std_collections"] }
minijinja-contrib = { version = "3", default-features = false, features = ["pycompat"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dev-dependencies]
tempfile = "3"
regex = "1"
serde_yaml = "0.9"
criterion = "0.5"
jugar-probar = { version = "1.0.2", default-features = false, features = ["tui"] }

[[bench]]
name = "builder_bench"
harness = false
