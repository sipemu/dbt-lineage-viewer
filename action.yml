name: dbt-lineage
description: "PR-time dbt lineage: diff, impact, plan selectors, lint, coverage. Posts a Markdown summary; uploads SARIF inline."

branding:
  icon: git-branch
  color: blue

inputs:
  version:
    description: dbt-lineage version to install. `latest` resolves to the most recent release.
    required: false
    default: latest
  project-dir:
    description: Path to the dbt project (containing dbt_project.yml).
    required: false
    default: .
  base:
    description: >
      Base git ref to diff against. `auto` uses the PR target branch
      (`github.base_ref`); empty disables the diff and plan sections. Branches
      missing from the checkout are resolved as `origin/<base>` and fetched.
    required: false
    default: auto
  manifest:
    description: Path to a pre-compiled manifest.json. When set, runs in manifest mode; otherwise SQL-parse mode.
    required: false
    default: ""
  comment:
    description: When true, post a Markdown comment on the PR with the rendered summary.
    required: false
    default: "true"
  sarif:
    description: >
      Comma-separated list of subcommands to also emit SARIF for
      (e.g. `lint,coverage`). Files are uploaded as workflow artifacts and
      submitted to GitHub Code Scanning so findings appear inline on the PR.
    required: false
    default: ""
  fail-on:
    description: >
      Cause the step to fail when given findings are present. Comma-separated:
      `lint-errors`, `plan-empty`, `manifest-stale`, or `never`. The PR comment
      and SARIF upload still happen before the step fails.
    required: false
    default: lint-errors

outputs:
  selector:
    description: The dbt-lineage plan selector (when `base` is set). Pipe into `dbt run -s`.
    value: ${{ steps.run.outputs.selector }}
  summary:
    description: Path to the Markdown summary file.
    value: ${{ steps.run.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Install dbt-lineage
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        if [ "$version" = "latest" ]; then
          # Read the whole response first: `curl | grep -m1` dies with SIGPIPE under pipefail.
          json="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/sipemu/dbt-lineage-viewer/releases/latest)"
          version="$(sed -nE 's/.*"tag_name": *"v([^"]+)".*/\1/p' <<<"$json")"
          version="${version%%$'\n'*}"
        fi
        echo "Installing dbt-lineage v${version}"
        # Detect platform
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)     target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64)   target="aarch64-unknown-linux-gnu" ;;
          macOS-X64)     target="x86_64-apple-darwin" ;;
          macOS-ARM64)   target="aarch64-apple-darwin" ;;
          Windows-X64)   target="x86_64-pc-windows-msvc" ;;
          *) echo "Unsupported platform"; exit 1 ;;
        esac
        archive_ext="tar.gz"
        [ "${{ runner.os }}" = "Windows" ] && archive_ext="zip"
        url="https://github.com/sipemu/dbt-lineage-viewer/releases/download/v${version}/dbt-lineage-v${version}-${target}.${archive_ext}"
        curl -fsSL -o "/tmp/dbt-lineage.${archive_ext}" "$url"
        mkdir -p "$HOME/.dbt-lineage-bin"
        if [ "$archive_ext" = "zip" ]; then
          unzip -j "/tmp/dbt-lineage.${archive_ext}" "*/dbt-lineage.exe" -d "$HOME/.dbt-lineage-bin"
        else
          tar -xzf "/tmp/dbt-lineage.${archive_ext}" -C "/tmp"
          mv "/tmp/dbt-lineage-v${version}-${target}/dbt-lineage" "$HOME/.dbt-lineage-bin/"
        fi
        echo "$HOME/.dbt-lineage-bin" >> "$GITHUB_PATH"

    - name: Run dbt-lineage
      id: run
      shell: bash
      env:
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        summary_md="$RUNNER_TEMP/dbt-lineage-report.md"
        manifest_args=()
        [ -n "$INPUT_MANIFEST" ] && manifest_args=(--manifest "$INPUT_MANIFEST")

        rc=0
        dbt-lineage ci report -p "$INPUT_PROJECT_DIR" --base "$INPUT_BASE" ${manifest_args[@]+"${manifest_args[@]}"} \
          --out "$summary_md" --outputs "$GITHUB_OUTPUT" --fail-on "${INPUT_FAIL_ON:-never}" || rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        if [ -f "$summary_md" ]; then
          echo "summary=$summary_md" >> "$GITHUB_OUTPUT"
          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"
        fi

        # SARIF outputs (when requested)
        if [ -n "$INPUT_SARIF" ]; then
          mkdir -p "$RUNNER_TEMP/dbt-lineage-sarif"
          IFS=, read -ra cmds <<< "$INPUT_SARIF"
          for cmd in "${cmds[@]}"; do
            case "$(echo "$cmd" | xargs)" in
              lint)
                dbt-lineage lint -p "$INPUT_PROJECT_DIR" ${manifest_args[@]+"${manifest_args[@]}"} -o sarif \
                  > "$RUNNER_TEMP/dbt-lineage-sarif/lint.sarif" || true
                ;;
              coverage)
                dbt-lineage coverage -p "$INPUT_PROJECT_DIR" -o sarif \
                  > "$RUNNER_TEMP/dbt-lineage-sarif/coverage.sarif" || true
                ;;
              *) echo "::warning::dbt-lineage: unknown sarif subcommand '$cmd'" ;;
            esac
          done
        fi
        exit 0

    - name: Upload SARIF (if produced)
      if: inputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ${{ runner.temp }}/dbt-lineage-sarif
        category: dbt-lineage

    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && steps.run.outputs.summary != ''
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: ${{ steps.run.outputs.summary }}
        header: dbt-lineage

    - name: Fail on conditions
      if: steps.run.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::dbt-lineage ci report exited with ${{ steps.run.outputs.exit-code }} (see report above)"
        exit 1
